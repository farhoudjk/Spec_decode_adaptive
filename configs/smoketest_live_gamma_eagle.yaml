# Smoke-test config for validating live_gamma_patch's EAGLE path on real
# hardware -- NOT a full experiment config. Same target/draft pairing as
# a5000_24gb_llama3_eagle.yaml (Llama-3.1-8B + EAGLE3), small batch cap for a
# fast run. See scripts/smoketest_live_gamma.py.
model:
  target_model: meta-llama/Llama-3.1-8B-Instruct
  draft_model: null
  eagle_model: yuhuili/EAGLE3-LLaMA3.1-Instruct-8B
  spec_method: eagle
  tp: 1
  gpu_mem_util: 0.85
  max_model_len: 2048
  dtype: float16
  enforce_eager: true

runtime:
  gamma_init: 4
  max_num_seqs_init: 16
  tpot_slo_s: 0.040
  ttft_slo_s: 2.0
  temperature: 0.0
  ignore_eos: true

controller:
  spec: static
  admit: static
  coordination: naive
  spec_kw: {gamma: 4}
  admit_kw: {max_num_seqs: 16}
  coord_kw: {}
